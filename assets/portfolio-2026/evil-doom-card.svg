<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Evil Doom Boy choose-your-hero artwork</title>
  <desc id="desc">Evil Doom Boy, the default playable hero, and Evil Doom Girl, the alternate playable hero, standing together in one shared moonlit scene.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08070f" stop-opacity=".05"/><stop offset=".72" stop-color="#301648" stop-opacity=".18"/><stop offset="1" stop-color="#4e2a84" stop-opacity=".48"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset=".68" stop-color="#08070f" stop-opacity="0"/><stop offset="1" stop-color="#08070f" stop-opacity=".82"/></linearGradient>
  </defs>
  <rect width="1200" height="750" rx="42" fill="#08070f"/>
  <svg width="1200" height="750" viewBox="150 320 768 480" preserveAspectRatio="xMidYMid slice">
    <image href="../evil-doom/evil-doom-hero-purple-1200.webp" width="1200" height="800"/>
  </svg>
  <rect width="1200" height="750" rx="42" fill="url(#shade)"/>
  <rect width="1200" height="750" rx="42" fill="url(#edge)"/>
  <path d="M600 90v540" stroke="#8c63d5" stroke-width="3" opacity=".16"/>
</svg>
